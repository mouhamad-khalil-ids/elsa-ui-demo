<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Submit a real estate transaction request."
    />
    <title>Dashboard — Workflow Portal</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ═══════════════════ Navigation Bar ═══════════════════ -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <a href="dashboard.html" class="navbar-brand" id="nav-brand">
        <div class="nav-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <span id="nav-app-name">Workflow Portal</span>
      </a>

      <button
        class="btn-logout"
        id="logout-btn"
        type="button"
        aria-label="Sign out"
      >
        <!-- Log-out icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Sign Out
      </button>
    </nav>

    <!-- ═══════════════════ Dashboard Page ═══════════════════ -->
    <main class="dashboard-page" id="dashboard-page">
      <div class="dashboard-card" role="main">
        <!-- Section Header -->
        <div class="section-header">
          <h2>Real Estate Transaction</h2>
          <p>Fill in all required fields to submit your transaction request.</p>
        </div>

        <!-- Required note -->
        <span class="required-note"
          ><span>*</span> All fields are mandatory</span
        >

        <!-- ── Transaction Form ── -->
        <form id="dashboard-form" novalidate autocomplete="on">
          <!-- Row 1: First name + Last name -->
          <div class="form-grid">
            <!-- First Name -->
            <div class="form-group">
              <label for="firstname"
                >First Name
                <span style="color: var(--color-error)">*</span></label
              >
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 20c0-4 3.582-7 8-7s8 3 8 7" />
                  </svg>
                </span>
                <input
                  type="text"
                  id="firstname"
                  name="firstname"
                  placeholder="e.g. John"
                  autocomplete="given-name"
                  required
                />
              </div>
            </div>

            <!-- Last Name -->
            <div class="form-group">
              <label for="lastname"
                >Last Name
                <span style="color: var(--color-error)">*</span></label
              >
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 20c0-4 3.582-7 8-7s8 3 8 7" />
                  </svg>
                </span>
                <input
                  type="text"
                  id="lastname"
                  name="lastname"
                  placeholder="e.g. Doe"
                  autocomplete="family-name"
                  required
                />
              </div>
            </div>
          </div>
          <!-- /.form-grid -->

          <!-- Row 2: Age + Real Estate Number -->
          <div class="form-grid">
            <!-- Age -->
            <div class="form-group">
              <label for="age"
                >Age <span style="color: var(--color-error)">*</span></label
              >
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                  </svg>
                </span>
                <input
                  type="number"
                  id="age"
                  name="age"
                  placeholder="e.g. 35"
                  min="1"
                  max="120"
                  required
                />
              </div>
            </div>

            <!-- Real Estate Number -->
            <div class="form-group">
              <label for="real-estate-number"
                >Real Estate Number
                <span style="color: var(--color-error)">*</span></label
              >
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"
                    />
                    <path d="M9 21V12h6v9" />
                  </svg>
                </span>
                <input
                  type="text"
                  id="real-estate-number"
                  name="realEstateNumber"
                  placeholder="e.g. RE-2024-00123"
                  required
                />
              </div>
            </div>
          </div>
          <!-- /.form-grid -->

          <!-- Type — Checkbox list -->
          <div class="form-group">
            <label>Type <span style="color: var(--color-error)">*</span></label>
            <div
              class="checkbox-group"
              id="type-group"
              role="group"
              aria-label="Type selection"
            >
              <label class="checkbox-option" for="type-personal">
                <input
                  type="checkbox"
                  id="type-personal"
                  name="type"
                  value="personal"
                />
                Personal
              </label>

              <label class="checkbox-option" for="type-company">
                <input
                  type="checkbox"
                  id="type-company"
                  name="type"
                  value="company"
                />
                Company
              </label>
            </div>
          </div>

          <!-- Transaction Type — Dropdown -->
          <div class="form-group">
            <label for="transaction-type"
              >Transaction Type
              <span style="color: var(--color-error)">*</span></label
            >
            <select id="transaction-type" name="transactionType" required>
              <option value="" disabled selected>
                Select transaction type
              </option>
              <option value="buy">Buy</option>
            </select>
          </div>

          <!-- Submit -->
          <div class="form-submit">
            <button type="submit" class="btn btn-primary" id="submit-btn">
              Submit Transaction
            </button>
          </div>
        </form>
      </div>
      <!-- /.dashboard-card -->
    </main>

    <!-- ═══════════════════ Toast ═══════════════════ -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- ═══════════════════ Loader Overlay ═══════════════════ -->
    <div id="loader-overlay" class="loader-overlay" aria-hidden="true">
      <div class="loader-spinner"></div>
    </div>

    <!-- ═══════════════════ Scripts ═══════════════════
         Load order:
         1. config/env.js   → ENV
         2. constants.js    → Usernames, DASHBOARD_ROUTES
         3. js/api.js       → API
         4. js/ui.js        → UI
         5. js/auth.js      → Auth
         6. js/dashboard.js → Dashboard
         7. Inline init
    ════════════════════════════════════════════════ -->
    <script src="config/env.js"></script>
    <script src="constants.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/store.js"></script>
    <script src="js/dashboard.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Sync app name from config
        const appNameEls = document.querySelectorAll("#nav-app-name");
        appNameEls.forEach((el) => (el.textContent = ENV.APP_NAME));
        document.title = `Dashboard — ${ENV.APP_NAME}`;

        // Init dashboard (auth guard + form wiring)
        Dashboard.initDashboardPage();
      });
    </script>
  </body>
</html>
